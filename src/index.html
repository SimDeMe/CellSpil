<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CellSpil — ny version</title>
  <!-- PixiJS v8 (samme som den gamle version brugte) -->
  <script src="https://pixijs.download/release/pixi.js"></script>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117;
      font-family: -apple-system, system-ui, sans-serif; color: #e6edf3; }
    #game-container { position: absolute; inset: 0; z-index: 0; }
    .panel { background: rgba(13, 17, 23, 0.78); border: 1px solid #30363d; border-radius: 10px;
      padding: 12px 14px; backdrop-filter: blur(4px); }
    #hud { position: absolute; top: 12px; left: 12px; z-index: 10; width: 220px; }
    #inspector { position: absolute; top: 12px; right: 12px; z-index: 10; width: 240px;
      max-height: calc(100vh - 240px); overflow-y: auto; }
    #inspector.hidden { display: none; }
    #minimap-wrap { position: absolute; bottom: 12px; right: 12px; z-index: 10; padding: 8px; }
    #minimap { display: block; border-radius: 6px; }
    #toggleInspect { position: absolute; top: 12px; right: 12px; z-index: 11; display: none; }
    #inspector.hidden ~ #toggleInspect { display: block; }
    button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px;
      padding: 6px 10px; font-size: 12px; cursor: pointer; }
    button:hover { border-color: #58a6ff; }
    #closeInspect { float: right; padding: 2px 8px; margin: -4px -4px 0 0; }
    #hint { position: absolute; bottom: 12px; left: 12px; z-index: 10; font-size: 12px;
      color: #8b949e; background: rgba(13,17,23,0.6); padding: 6px 10px; border-radius: 8px; }

    /* Stor delings-knap nederst midt på skærmen. */
    #divideBtn { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 12; padding: 13px 30px; font-size: 15px; font-weight: 700; border-radius: 12px;
      border: 1px solid #30363d; background: rgba(33, 38, 45, 0.85); color: #8b949e;
      cursor: default; opacity: 0.7; transition: opacity .15s, background .15s, color .15s, box-shadow .15s; }
    #divideBtn.ready { color: #d7ffd9; background: rgba(76, 175, 80, 0.28); border-color: #4caf50;
      cursor: pointer; opacity: 1; animation: dividePulse 1.4s ease-in-out infinite; }
    #divideBtn.ready:hover { background: rgba(76, 175, 80, 0.42); }

    /* Evne-bjælke (udskillelses-skyer) lige over delings-knappen. */
    #abilityBar { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      z-index: 12; display: flex; gap: 8px; }
    #abilityBar .ability { font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 10px;
      background: rgba(33, 38, 45, 0.9); border-color: #455a64; }
    #abilityBar .ability:hover:not(:disabled) { border-color: #80cbc4; }
    @keyframes dividePulse {
      0%, 100% { box-shadow: 0 0 12px rgba(76, 175, 80, 0.45); }
      50%      { box-shadow: 0 0 24px rgba(76, 175, 80, 0.9); }
    }

    /* Knaprække øverst midt: Pause + Inspect. */
    #topbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 11; display: flex; gap: 8px; }
    #pauseBtn.paused { border-color: #ffca28; color: #ffd54f; }

    /* Inspect-modal med faner. */
    #inspectModal { position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
      z-index: 20; width: 360px; display: flex; flex-direction: column; }
    #inspectModal.hidden { display: none; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tabbar { display: flex; gap: 4px; margin: 6px 0; }
    .tabbar button { flex: 1; font-size: 11px; padding: 5px 4px; }
    .tabbar button.active { border-color: #58a6ff; color: #fff; background: #1f2d3d; }
    .modal-body { max-height: calc(100vh - 200px); overflow-y: auto; }
    .tabpane { display: none; }
    .tabpane.active { display: block; }
    #inspectModal .ih { font-size: 11px; color: #8b949e; text-transform: uppercase;
      letter-spacing: .06em; margin: 12px 0 4px; }
    #inspectModal .muted { color: #6e7681; font-size: 12px; }
    #inspectModal .mrow { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; gap: 10px; }
    #inspectModal .sub { font-size: 10px; color: #6e7681; margin: 1px 0 4px; text-align: right; }
    #inspectModal .mut { border: 1px solid #30363d; border-radius: 7px; padding: 7px 9px; margin: 4px 0; }
    #inspectModal .mut .t { font-weight: 600; font-size: 12px; }
    #inspectModal .mut .d { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .blank { color: #6e7681; font-size: 12px; font-style: italic; padding: 22px 4px; text-align: center; }
  </style>
</head>

<body>
  <div id="game-container"></div>

  <div id="topbar">
    <button id="pauseBtn">⏸ Pause</button>
    <button id="inspectBtn">🔍 Inspect</button>
  </div>

  <div id="inspectModal" class="panel hidden">
    <div class="modal-head">
      <div style="font-weight:700;font-size:13px;letter-spacing:.08em;color:#8b949e;">INSPECT — inde i cellen</div>
      <button id="closeInspectModal" style="padding:2px 8px;">✕</button>
    </div>
    <div class="tabbar">
      <button class="active" data-tab="tabMutations">🧬 Mutationer</button>
      <button data-tab="tabMetabolism">⚡ Metabolisme</button>
      <button data-tab="tabKatabolism">📉 Katabolisme</button>
      <button data-tab="tabAnabolism">📈 Anabolisme</button>
    </div>
    <div class="modal-body">
      <div id="tabMutations" class="tabpane active"><div id="tabMutationsBody"></div></div>
      <div id="tabMetabolism" class="tabpane"><div id="tabMetabolismBody"></div></div>
      <div id="tabKatabolism" class="tabpane"><div class="blank">Katabolisme — kommer senere.</div></div>
      <div id="tabAnabolism" class="tabpane"><div class="blank">Anabolisme — kommer senere.</div></div>
    </div>
  </div>

  <div id="hud" class="panel"></div>

  <div id="inspector" class="panel">
    <button id="closeInspect" title="Skjul">✕</button>
    <div id="inspector-body"></div>
  </div>
  <button id="toggleInspect">🧬 Evolution</button>

  <div id="minimap-wrap" class="panel">
    <canvas id="minimap" width="180" height="180"></canvas>
  </div>

  <div id="hint">Bevæg musen — din celle svømmer derhen. (Ny version, src/)</div>

  <div id="abilityBar"></div>

  <button id="divideBtn">Del dig (D)</button>

  <script type="module">
    import { startGame } from './game/main.js';

    const PIXI = globalThis.PIXI;
    const app = new PIXI.Application();

    await app.init({
      background: '#0d1117',
      resizeTo: window,
      antialias: true,
      autoDensity: true,
      resolution: window.devicePixelRatio || 1,
    });
    document.getElementById('game-container').appendChild(app.canvas);

    // Evolution-panel (køb): kan skjules/vises.
    const inspector = document.getElementById('inspector');
    document.getElementById('closeInspect').addEventListener('click', () => inspector.classList.add('hidden'));
    document.getElementById('toggleInspect').addEventListener('click', () => inspector.classList.remove('hidden'));

    // Inspect-modal: åbn/luk + faneskift.
    const inspectModal = document.getElementById('inspectModal');
    document.getElementById('inspectBtn').addEventListener('click', () => inspectModal.classList.toggle('hidden'));
    document.getElementById('closeInspectModal').addEventListener('click', () => inspectModal.classList.add('hidden'));
    for (const tab of inspectModal.querySelectorAll('.tabbar button')) {
      tab.addEventListener('click', () => {
        for (const b of inspectModal.querySelectorAll('.tabbar button')) b.classList.remove('active');
        for (const p of inspectModal.querySelectorAll('.tabpane')) p.classList.remove('active');
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    }

    startGame({
      app,
      window,
      hudRoot: document.getElementById('hud'),
      inspectorRoot: document.getElementById('inspector-body'),
      minimapCanvas: document.getElementById('minimap'),
      divideButton: document.getElementById('divideBtn'),
      abilityBar: document.getElementById('abilityBar'),
      pauseButton: document.getElementById('pauseBtn'),
      inspect: {
        modal: inspectModal,
        mutations: document.getElementById('tabMutationsBody'),
        metabolism: document.getElementById('tabMetabolismBody'),
      },
    });
  </script>
</body>

</html>
